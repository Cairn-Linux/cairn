# SDDM for Cairn (ADR-0016). Installed to /etc/sddm.conf.d/ by provisioning.
# The Guardian list, HideUsers, is written beside this file as
# 20-cairn-guardians.conf, since it changes with the accounts.

[Wayland]
# Only Cairn's session directory, so the greeter offers cairn.desktop and
# nothing else (ADR-0012). The session dispatcher picks the real one.
SessionDir=/usr/local/share/cairn/sessions

[Theme]
# Phase 0. The Cairn theme is a Phase 1 task.
Current=breeze
