# SPDX-License-Identifier: Apache-2.0
# SDDM for Cairn (ADR-0016). Installed to /etc/sddm.conf.d/ by provisioning.
# Nobody is hidden from the login screen (ADR-0020), so there is no
# HideUsers.

[General]
# The login screen imports Cairn.Brand and Cairn.Greeter from Cairn's own QML
# directory. SDDM takes one GreeterEnvironment line, and Fedora's
# plasma-wayland.conf sets the shell integration there, so this line repeats
# it; without it the greeter has no layer shell under kwin_wayland.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_IMPORT_PATH=/usr/local/lib64/cairn/qml

[Wayland]
# Only Cairn's session directory, so the greeter offers cairn.desktop and
# nothing else (ADR-0012). The session dispatcher picks the real one.
SessionDir=/usr/local/share/cairn/sessions

[Theme]
# The Cairn login screen, greeter/theme in the repository (ADR-0020).
ThemeDir=/usr/local/share/cairn/sddm/themes
Current=cairn
