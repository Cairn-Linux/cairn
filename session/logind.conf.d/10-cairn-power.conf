# The power button (ADR-0018). A tap does nothing at any level: logind leaves
# the key alone, the kiosk has no binding for it, and Plasma at L3 and L4
# takes its own inhibitor and handles it as it always has. Holding it for
# five seconds powers the machine off in order, through logind, so nothing
# is left half-written. Installed to /etc/systemd/logind.conf.d/.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
