# The power button (ADR-0018). A tap does nothing at any level: logind leaves
# the key alone, the kiosk has no binding for it, and Plasma at L3 and L4
# takes its own inhibitor and handles it as it always has. Holding it for
# five seconds powers the machine off in order, through logind, so nothing
# is left half-written. No program's shutdown lock stops the hold, at any
# level: it is the way out of a screen that looks wrong, so a program that
# says it is busy must not keep a grown-up from it (ADR-0049). Plasma's own
# inhibitor is of the kind logind always honours, so L3, L4 and Guardians
# are unaffected. Installed to /etc/systemd/logind.conf.d/.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
PowerKeyIgnoreInhibited=yes
