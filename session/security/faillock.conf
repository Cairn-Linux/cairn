# pam_faillock for Cairn (ADR-0020). Installed to /etc/security/ by
# provisioning, which also turns on authselect's with-faillock feature so the
# lockout applies to the greeter, su, sudo and the lock screen alike. L1 and
# L2 children never reach it: the greeter lets them in before password-auth.
#
# Fedora's defaults stand (three wrong passwords in fifteen minutes lock the
# account for ten), except where the count is kept. The default,
# /var/run/faillock, is cleared at every boot, and any child can reboot by
# holding the power button (ADR-0018). SELinux labels this directory as
# faillog_t through a rule provisioning adds.
dir = /var/lib/faillock
