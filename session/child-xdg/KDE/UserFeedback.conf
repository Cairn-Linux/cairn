;
; KDE's usage reports are off in an L3 or L4 child's login (DESIGN §9.3,
; #36). KDE's feedback library, KUserFeedback, reads this switch before
; every report, for Plasma, Dolphin, Kate and any other KDE program, with
; Qt's QSettings("KDE", "UserFeedback"). QSettings takes the first file
; that has the key: the account's own ~/.config/KDE/UserFeedback.conf,
; then the folders in XDG_CONFIG_DIRS in order: /etc/xdg, KDE's profile
; folder, then this one, which cairn-session puts last so the locks in
; kdeglobals beside it hold (ADR-0058). Neither earlier folder has a file
; of this name, and the build check stops if one sets Enabled. The reports
; are off by default anyway; this keeps a child's choice in Plasma's,
; Dolphin's or Kate's User Feedback settings from sending anything.
;
; This is a hide, not a wall. A file of the child's own with Enabled=true
; wins, and Dolphin's and Kate's settings still look as if they work.
; Comments here start with a semicolon, the only kind QSettings skips.
[UserFeedback]
Enabled=false
