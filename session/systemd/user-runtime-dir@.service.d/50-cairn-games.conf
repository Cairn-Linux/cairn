# An account's last session has ended, and its runtime folder goes: the
# moment a child's waiting games can be copied (ADR-0041). It stops after
# user@UID.service and after every session, closing ones too, about
# UserStopDelaySec after the last logout.
#
# "-": a failure here never breaks a logout. "--no-block": the copy never
# holds up the stop, and at shutdown its start conflicts with
# shutdown.target and is dropped.
[Service]
ExecStopPost=-/usr/bin/systemctl start --no-block cairn-finish-games@%i.service
