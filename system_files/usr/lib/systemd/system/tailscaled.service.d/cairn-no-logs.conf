# Tailscale's logs stay on this computer (DESIGN §9.3: no telemetry; #36).
# tailscaled is off in the image, but once someone starts it, it sends its
# logs to log.tailscale.com unless this variable is set, and the
# package's /etc/default/tailscaled sets no flag that stops it.
#
# This is a default, not a lock. systemd lets a variable in the unit's
# EnvironmentFile, /etc/default/tailscaled, win over this line, so a
# grown-up who needs the logs adds TS_NO_LOGS_NO_SUPPORT=false there.
# Tailscale's support needs the logs to help. A tailnet can require them
# too, and tailscaled then says to take this setting away.
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
