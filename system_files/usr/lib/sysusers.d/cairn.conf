# Cairn's level groups and the Guardian's group (ADR-0011, ADR-0038).
# systemd-sysusers makes each one at first boot, unless a group of that
# name is already there, which then keeps its own number.
#
# The numbers are fixed. The image owns the Guardian's window by
# cairn-guardian's number at build time, before the group exists. The
# others are fixed too, so every Cairn machine numbers them the same.
# Nothing in the base uses 460 to 465. Bazzite's system groups count down
# from 999 and reach 959, and Fedora's fixed ones stay below 201.
#
#Type Name           ID
g     cairn-l1       461
g     cairn-l2       462
g     cairn-l3       463
g     cairn-l4       464
g     cairn-guardian 465
