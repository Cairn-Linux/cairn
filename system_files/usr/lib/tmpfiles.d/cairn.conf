# The folders a Cairn machine keeps in /var (ADR-0038). An image cannot put
# anything in /var, so systemd-tmpfiles makes these at every boot, and puts
# back an owner, mode or ACL that changed. The modes match what
# provision/cairn-provision.sh makes on a machine it sets up by hand.

#Type Path                                     Mode User Group          Age Argument
d     /var/lib/cairn                           0755 root root           -
# Where a Guardian's Steam installs the games every child gets a copy of
# (ADR-0033). Only Guardians may change it, and every account may read it.
# The default ACL gives the group what Steam's own modes ask for, whatever
# a Guardian's umask, and setgid keeps the group on what Steam makes
# inside. Only these two folders: the games inside are Steam's.
d     /var/lib/cairn/steam-library             2775 root cairn-guardian -
a     /var/lib/cairn/steam-library             -    -    -              -   u::rwx,g::rwx,g:cairn-guardian:rwx,m::rwx,o::r-x,d:u::rwx,d:g::rwx,d:g:cairn-guardian:rwx,d:m::rwx,d:o::r-x
d     /var/lib/cairn/steam-library/steamapps   2775 root cairn-guardian -
a     /var/lib/cairn/steam-library/steamapps   -    -    -              -   u::rwx,g::rwx,g:cairn-guardian:rwx,m::rwx,o::r-x,d:u::rwx,d:g::rwx,d:g:cairn-guardian:rwx,d:m::rwx,d:o::r-x
# The picture on each game tile (ADR-0035). Only root may change them;
# every child reads them.
d     /var/lib/cairn/game-pictures             0755 root root           -
# pam_faillock's count of wrong passwords, kept across a reboot
# (ADR-0020, session/security/faillock.conf). SELinux labels it faillog_t
# through the rule build_files/build.sh adds.
d     /var/lib/faillock                        0755 root root           -
