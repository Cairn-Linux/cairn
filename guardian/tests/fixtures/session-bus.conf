<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A session bus for the tests that stand in for kwalletd (ADR-0043), given
  to dbus-run-session with config-file. It is dbus-run-session's own
  session bus without the service folders: on a computer with KDE, that
  bus starts the real kwalletd for a call no stand-in answers, and kwalletd
  then wakes the real wallet. On this bus such a call fails at once, as on
  a computer without KDE.
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
